#=============================================================
# 烽火棋 · Nginx 伪静态规则
#
# 用法：宝塔 / aaPanel / 1Panel 等面板 → 站点设置 → 伪静态
#       把本文件内容整段粘进去，保存即生效（面板会插入到 server 块内）。
#       手工配置 Nginx 的，把内容放进对应站点的 server { } 里。
#
# 作用：拦掉不该被 HTTP 访问的文件与目录。这些路径全部只在服务端
#       被 require 或被 Node 读取，前端从不直接请求，封掉不影响功能。
#=============================================================

# ---- .env ----
location ~ /\.env {
    deny all;
    return 404;
}

location ~ /\. {
    deny all;
    return 404;
}

# ---- 后台内部库与审计日志 ----
location ^~ /admin/lib/ {
    deny all;
    return 404;
}
location ^~ /admin/logs/ {
    deny all;
    return 404;
}

# ---- 仅服务端引用的目录 ----
location ^~ /cofd/ {
    deny all;
    return 404;
}
location ^~ /vendor/ {
    deny all;
    return 404;
}
location ^~ /phpmailer/ {
    deny all;
    return 404;
}
location ^~ /node_modules/ {
    deny all;
    return 404;
}
# ---- 备份 / 数据库导出 / 依赖清单 ----
location ~* \.(bak|sql|log|tmp[0-9]*|lock)$ {
    deny all;
    return 404;
}
location ~* ^/(composer|package|package-lock|composer\.lock)\.(json|lock)$ {
    deny all;
    return 404;
}

# ---- 目录列表 ----
autoindex off;

