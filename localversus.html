<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <title>烽火棋-本地对战</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/game.css">
</head>
<style>
  .winjing-backtohall{
       margin-top: 14px;
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .12em;
      cursor: pointer;
      color: #071018;
      font-family: inherit;
      background: linear-gradient(135deg, #7fd0ff, #4a9bff);
      box-shadow: 0 4px 18px rgba(70, 150, 255, .5);
      transition: transform .12s, box-shadow .12s;
   
  }
  .winjing-backtohall2{
      padding: 15px 20px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .16em;
      cursor: pointer;
      color: #071018;
      font-family: inherit;
      background: linear-gradient(135deg, #7fd0ff, #4a9bff);
      box-shadow: 0 5px 22px rgba(70,150,255,.6);
      transition: transform .12s, box-shadow .12s;
  }
</style>
<body>
  <div id="status" class="panel">
    <h3>◈ 战局状态</h3>
    <div class="turn-badge" id="turnBadge"><span class="turn-dot"></span>红方回合 · 第 1 回合</div>
    <div class="count-row">
      <div class="count-box red">
        <div class="num" id="redCount">20</div>
        <div class="lbl">红方棋子</div>
      </div>
      <div class="count-box blue">
        <div class="num" id="blueCount">20</div>
        <div class="lbl">蓝方棋子</div>
      </div>
    </div>
    <div class="thresh">
      <div><span class="tag" id="coreTag">≤26</span>核心进攻限制：<b id="coreState" style="color:#ff9b9e">生效中</b></div>
      <div><span class="tag on">≤20</span>迷雾解除阈值：<b id="fogThreshState">待触发</b></div>
      <div><span class="tag">步长</span>军棋步长　红<b id="genStepR">3</b>　蓝<b id="genStepB">3</b></div>
    </div>
  </div>
  <div id="fog" class="panel">
    <h3>◈ 视野迷雾</h3>
    <div class="fog-toggle">
      <span class="fog-state" id="fogState">迷雾开启</span>
      <div class="switch" id="fogSwitch"></div>
    </div>
    <div class="fog-hint" id="fogSides"><span class="fog-lamp"></span>红：迷雾　蓝：迷雾</div>
    <div class="fog-hint">对方子棋阵亡 / 总数 ≤20 时解除</div>
  </div>

 
  <div id="legend" class="panel">
    <h3>◈ 棋子图例</h3>
    <div class="legend-grid" id="legendGrid"></div>
  </div>

  
  <div id="logpanel" class="panel">
    <h3>◈ 操作记录</h3>
    <ul class="log-list" id="logList">
      <li>游戏开始</li>
    </ul>
    <button id="restart">重 新 开 始</button>
    <button class="winjing-backtohall" onclick="window.close();setTimeout(function() {location.href = 'index.php';}, 200);">回 到 大 厅</button>
  </div>

  
  <div id="board"></div>

  
  <div id="winOverlay">
    <div class="win-inner">
      <div class="win-card" id="winCard">获胜</div>
      <div id="ratingPanel" style="display:none"></div>
      <button id="winRestart">重 新 开 始</button>
      <button class="winjing-backtohall2" onclick="window.close();setTimeout(function() {location.href = 'index.php';}, 200);">回 到 大 厅</button>
    </div>
  </div>

  
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <radialGradient id="gRed" cx="35%" cy="28%" r="75%">
        <stop offset="0%" stop-color="#ffd0c9" />
        <stop offset="35%" stop-color="#ff6d6d" />
        <stop offset="100%" stop-color="#8f1620" />
      </radialGradient>
      <radialGradient id="gBlue" cx="35%" cy="28%" r="75%">
        <stop offset="0%" stop-color="#d5ecff" />
        <stop offset="35%" stop-color="#5aa0ff" />
        <stop offset="100%" stop-color="#153a86" />
      </radialGradient>
    </defs>
  </svg>

  
  <script src="assets/core/engine.js"></script>
  <script src="assets/core/rating.js"></script>
  <script src="assets/core/ui.js"></script>
  <script src="assets/core/scorefx.js"></script>
  <script src="assets/core/replay.js"></script>
  <script>
    (function () {
      const engine = Engine.createGame();
      const rec = Replay.attachRecorder({ mode: "local", getNames: () => ({ red: "红方", blue: "蓝方" }) });
      function showRating() {
        if (!window.Rating) return;
        UI.settle({
          panel: "ratingPanel",
          match: engine.state.over ? Rating.computeMatch(engine.getRatingData()) : null,
          side: null,            
          cardSide: null,
          extra: { hint: "点击任意处关闭" },
        });
      }
      const ui = UI.createUI({
        engine,
        getViewer: () => engine.state.turn,
        canInteract: () => true,
        onMove: (id, r, c) => { const res = engine.move(id, r, c); showRating(); rec.observe(engine); return res; },
        onRestart: () => { engine.reset(); ui.buildBoard(); ui.render(); showRating(); rec.observe(engine); },
      });
      rec.observe(engine);   // 初始开局帧
    })();
  </script>
</body>

</html>
